name: Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Minsta möjliga rättighet: jobben får bara läsa koden
permissions:
  contents: read

# En ny push avbryter en äldre körning på samma branch som inte hunnit bli klar
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  unit-tests:
    name: Enhetstester
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -v --junitxml=unit-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: unit-results.xml
          if-no-files-found: warn

  integration-tests:
    name: Integrationstester
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run integration tests
        run: python -m pytest tests/integration -v --junitxml=integration-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: integration-results.xml
          if-no-files-found: warn
  build-image:
    name: Bygg och testa image
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Bygger imagen en gång, taggad med commit-SHA:n.
      # cache-from/cache-to återanvänder lager mellan körningar (snabbare byggen).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: servicekoll:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name servicekoll -p 8000:8000 servicekoll:${{ github.sha }}

      - name: Wait for health check
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "Containern svarar"
              exit 0
            fi
            echo "Väntar på containern..."
            sleep 2
          done
          echo "Containern startade inte"
          exit 1

      - name: Check version
        run: |
          VERSION=$(curl --fail --silent http://localhost:8000/version | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "Containern kör version: $VERSION"
          if [ "$VERSION" != "${{ github.sha }}" ]; then
            echo "Fel version! Förväntade ${{ github.sha }}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      # Samma integrationstester som förut, men nu mot den riktiga containern
      - name: Run integration tests against container
        env:
          BASE_URL: http://localhost:8000
        run: python -m pytest tests/integration -v

      - name: Show container logs
        if: failure()
        run: docker logs servicekoll

      - name: Stop container
        if: always()
        run: docker rm -f servicekoll || true