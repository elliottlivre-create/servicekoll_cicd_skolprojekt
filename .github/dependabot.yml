version: 2
updates:
  # Python-paketen i requirements.txt och requirements-dev.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Versionerna av actions i .github/workflows (checkout, setup-python osv.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Basimagen i Dockerfile (python:3.12-slim)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"